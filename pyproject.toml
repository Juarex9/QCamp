[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qcamp"
version = "0.1.0"
description = "Agente local de remitos agrícolas (QVAC), offline-first"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "pytest",
    "httpx",
    "ruff",
    "tetherto-qvac-sdk",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "schema.sql",
    "templates/*.html",
    "templates/partials/*.html",
    "static/*",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
