<button
  type="button"
  class="theme-toggle"
  id="theme-toggle"
  aria-label="Alternar modo claro y oscuro"
  aria-pressed="false"
>
  <span class="theme-toggle__label theme-toggle__label--to-light" aria-hidden="true"
    >Claro</span
  >
  <span class="theme-toggle__label theme-toggle__label--to-dark" aria-hidden="true"
    >Oscuro</span
  >
</button>
